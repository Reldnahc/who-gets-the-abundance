name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure production URL
        shell: bash
        env:
          CONFIGURED_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          if [ -n "$CONFIGURED_SITE_URL" ]; then
            echo "PUBLIC_SITE_URL=$CONFIGURED_SITE_URL" >> "$GITHUB_ENV"
          else
            repository_name="${GITHUB_REPOSITORY#*/}"
            if [ "$repository_name" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
              echo "PUBLIC_SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> "$GITHUB_ENV"
            else
              echo "PUBLIC_SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/${repository_name}" >> "$GITHUB_ENV"
            fi
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and build
        run: npm run verify

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
